services:
  platform:
    build: ./platform
    container_name: linux-lab-platform
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - platform-data:/data
    environment:
      - LAB_IMAGE=linux-lab
      - JEST_IMAGE=jest-lab
      - DOCKER_LAB_IMAGE=docker-lab
      # Parcours Docker : chaque étudiant a son propre moteur Docker.
      # sysbox-runc (recommandé, nécessite Sysbox sur l'hôte) ou privileged (machine dédiée / développement)
      - DOCKER_LAB_RUNTIME=${DOCKER_LAB_RUNTIME:-sysbox-runc}
      - LAB_NETWORK=linux-lab-students
      - DB_PATH=/data/platform.db
      # Compte enseignant : définissez-les dans un fichier .env (voir .env.example)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@lab.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_FIRST=${ADMIN_FIRST:-Admin}
      - ADMIN_LAST=${ADMIN_LAST:-Lab}
      # Arrêt des conteneurs étudiants sans activité (secondes)
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-7200}
      # Mettre à 1 derrière un reverse proxy HTTPS
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
    restart: unless-stopped
    depends_on:
      lab-image:
        condition: service_completed_successfully
      jest-image:
        condition: service_completed_successfully
      docker-image:
        condition: service_completed_successfully

  # Ce service construit seulement l'image des conteneurs étudiants (parcours Linux), puis s'arrête
  lab-image:
    build: ./lab
    image: linux-lab
    entrypoint: ["echo", "Lab image built"]

  # Idem pour l'image du parcours Jest
  jest-image:
    build: ./jest-lab
    image: jest-lab
    entrypoint: ["echo", "Jest lab image built"]

  # Idem pour l'image du parcours Docker (moteur Docker + images de base préchargées)
  docker-image:
    build: ./docker-lab
    image: docker-lab
    entrypoint: ["echo", "Docker lab image built"]

volumes:
  platform-data:
