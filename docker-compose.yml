services:
  platform:
    build: ./platform
    container_name: linux-lab-platform
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - platform-data:/data
    environment:
      - LAB_IMAGE=linux-lab
      - LAB_NETWORK=linux-lab-students
      - DB_PATH=/data/platform.db
      # Compte enseignant : définissez-les dans un fichier .env (voir .env.example)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@lab.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_FIRST=${ADMIN_FIRST:-Admin}
      - ADMIN_LAST=${ADMIN_LAST:-Lab}
      # Arrêt des conteneurs étudiants sans activité (secondes)
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-7200}
      # Mettre à 1 derrière un reverse proxy HTTPS
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
    restart: unless-stopped
    depends_on:
      lab-image:
        condition: service_completed_successfully

  # Ce service construit seulement l'image des conteneurs étudiants, puis s'arrête
  lab-image:
    build: ./lab
    image: linux-lab
    entrypoint: ["echo", "Lab image built"]

volumes:
  platform-data:
