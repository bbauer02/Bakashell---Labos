<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ asset('apple-touch-icon.png') }}">
    <title>{% block title %}{{ APP_TITLE }}{% endblock %}</title>
    <meta name="author" content="{{ AUTHOR_NAME }} ({{ AUTHOR_EMAIL }})">
    <meta name="description" content="{{ APP_DESCRIPTION }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ APP_TITLE }}">
    <meta property="og:description" content="{{ APP_DESCRIPTION }}">
    <link rel="stylesheet" href="{{ asset('theme.css') }}">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font-sans); background:var(--bg); color:var(--text); min-height:100vh; }
        a { color:var(--accent-l); text-decoration:none; }
        a:hover { text-decoration:underline; }
        code { background:var(--bg); padding:2px 6px; border-radius:4px; font-family:var(--font-mono); font-size:12px; color:var(--cyan); }
        .site-footer { text-align:center; color:var(--dim); font-size:12px; padding:18px 16px 24px; }
        .site-footer a { color:var(--dim); text-decoration:underline; }
        .role-badge { display:inline-block; vertical-align:middle; font-size:11px; font-weight:600; letter-spacing:.4px; padding:3px 9px; border-radius:10px; background:rgba(0,206,201,.12); color:var(--cyan); margin-left:10px; }
        .role-badge.admin { background:rgba(253,203,110,.14); color:#fdcb6e; }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>{% block body %}{% endblock %}
<footer class="site-footer">{{ APP_TITLE }} · plateforme conçue par {{ AUTHOR_NAME }} — <a href="mailto:{{ AUTHOR_EMAIL }}">{{ AUTHOR_EMAIL }}</a> · <a href="/confidentialite">Mentions légales et confidentialité</a></footer>
</body>
</html>
