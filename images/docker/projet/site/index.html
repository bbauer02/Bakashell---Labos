<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cimes &amp; Sentiers — Matériel de randonnée</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f1ea; color: #243127; }
    header { background: #2f5d3a; color: #fff; padding: 32px 24px; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    .produit { background: #fff; border-radius: 8px; padding: 12px 16px; margin: 8px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Cimes &amp; Sentiers</h1>
    <p>Du matériel de randonnée choisi par des randonneurs.</p>
  </header>
  <main>
    <h2>Nos incontournables</h2>
    <div id="produits"><p>Chargement du catalogue…</p></div>
  </main>
  <script>
    fetch('/api/produits')
      .then((r) => r.json())
      .then((liste) => {
        document.getElementById('produits').innerHTML = liste
          .map((p) => `<div class="produit"><strong>${p.libelle}</strong> — ${p.prixHT.toFixed(2)} € HT</div>`)
          .join('');
      })
      .catch(() => {
        document.getElementById('produits').innerHTML = "<p>Catalogue indisponible (l'API n'est pas encore branchée).</p>";
      });
  </script>
</body>
</html>
