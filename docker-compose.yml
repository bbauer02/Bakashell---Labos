services:
  platform:
    build: ./platform
    container_name: linux-lab-platform
    ports:
      # Derrière le reverse proxy HTTPS : PLATFORM_BIND=127.0.0.1 (port 8080 fermé à l'extérieur)
      - "${PLATFORM_BIND:-0.0.0.0}:8080:8080"
    networks:
      - default
      # Réseau partagé avec le reverse proxy HTTPS (Caddy) : docker network create --subnet 172.30.0.0/24 web-proxy
      - web-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - platform-data:/data
      # Sauvegardes automatiques de la base, lisibles directement sur l'hôte
      - ./backups:/backups
    environment:
      - LAB_IMAGE=linux-lab
      - JEST_IMAGE=jest-lab
      - DOCKER_LAB_IMAGE=docker-lab
      - GIT_LAB_IMAGE=git-lab
      - ANSIBLE_LAB_IMAGE=ansible-lab
      - PROJET_LAB_IMAGE=projet-lab
      # Parcours Docker, Ansible et projet final : chaque étudiant a son propre moteur Docker.
      # sysbox-runc (recommandé, nécessite Sysbox sur l'hôte) ou privileged (machine dédiée / développement)
      - DOCKER_LAB_RUNTIME=${DOCKER_LAB_RUNTIME:-sysbox-runc}
      - LAB_NETWORK=linux-lab-students
      - DB_PATH=/data/platform.db
      # Compte enseignant : définissez-les dans un fichier .env (voir .env.example)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@lab.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_FIRST=${ADMIN_FIRST:-Admin}
      - ADMIN_LAST=${ADMIN_LAST:-Lab}
      # Arrêt des conteneurs étudiants sans activité (secondes)
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-7200}
      # Mettre à 1 derrière un reverse proxy HTTPS
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
      # Adresse publique (ex. https://lab.mon-lycee.fr) des liens transmis : réinitialisation, attestation
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Fuseau horaire des échéances
      - TZ=${TZ:-Europe/Paris}
      # Adresse du reverse proxy, pour connaître l'IP réelle des étudiants (limitation des tentatives de connexion)
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Sauvegarde de la base toutes les BACKUP_HOURS heures dans ./backups, en gardant les BACKUP_KEEP dernières
      - BACKUP_DIR=/backups
      - BACKUP_HOURS=${BACKUP_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      # Part des points (en %) à atteindre pour obtenir l'attestation de fin de parcours
      - CERTIFICATE_MIN_PCT=${CERTIFICATE_MIN_PCT:-70}
    restart: unless-stopped
    depends_on:
      lab-image:
        condition: service_completed_successfully
      jest-image:
        condition: service_completed_successfully
      docker-image:
        condition: service_completed_successfully
      git-image:
        condition: service_completed_successfully
      ansible-image:
        condition: service_completed_successfully
      projet-image:
        condition: service_completed_successfully

  # Ce service construit seulement l'image des conteneurs étudiants (parcours Linux), puis s'arrête
  lab-image:
    build: ./images/linux
    image: linux-lab
    entrypoint: ["echo", "Lab image built"]

  # Idem pour l'image du parcours Jest
  jest-image:
    build: ./images/jest
    image: jest-lab
    entrypoint: ["echo", "Jest lab image built"]

  # Idem pour l'image du parcours Docker (moteur Docker + images de base préchargées)
  docker-image:
    build: ./images/docker
    image: docker-lab
    entrypoint: ["echo", "Docker lab image built"]

  # Idem pour l'image du parcours Git (git, dépôt partagé local dans /srv/git)
  git-image:
    build: ./images/git
    image: git-lab
    entrypoint: ["echo", "Git lab image built"]

  # Idem pour l'image du parcours Ansible (poste de contrôle + serveurs gérés + dépôt APT interne)
  ansible-image:
    build: ./images/ansible
    image: ansible-lab
    entrypoint: ["echo", "Ansible lab image built"]

  # Idem pour l'image du projet final (poste de contrôle Ansible + Git, Node et Jest + serveur de construction Docker)
  projet-image:
    build: ./images/projet
    image: projet-lab
    entrypoint: ["echo", "Projet lab image built"]

networks:
  web-proxy:
    external: true

volumes:
  platform-data:
