<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux CLI Lab</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #161822;
            --bg-panel: #1a1d2e;
            --bg-card: #232639;
            --border: #2a2d3e;
            --text: #e1e4ed;
            --text-dim: #8b8fa3;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --success: #00b894;
            --success-bg: rgba(0, 184, 148, 0.1);
            --warning: #fdcb6e;
            --danger: #e17055;
            --danger-bg: rgba(225, 112, 85, 0.1);
            --cyan: #00cec9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ─── Top Bar ──────────────────────────────── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 56px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo svg { width: 28px; height: 28px; }

        .topbar-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .step-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-dim);
        }

        .step-dot:hover { border-color: var(--accent); color: var(--text); }
        .step-dot.active { border-color: var(--accent); background: var(--accent); color: white; }
        .step-dot.done { border-color: var(--success); background: var(--success); color: white; }
        .step-dot.partial { border-color: var(--warning); color: var(--warning); }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            padding: 6px 16px;
            border-radius: 20px;
        }

        .score-num {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-light);
        }

        .score-label { font-size: 12px; color: var(--text-dim); }

        .progress-ring {
            width: 36px;
            height: 36px;
        }

        .progress-ring circle {
            fill: none;
            stroke-width: 3;
        }

        .progress-ring .bg { stroke: var(--border); }
        .progress-ring .fg {
            stroke: var(--accent-light);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s;
            transform: rotate(-90deg);
            transform-origin: center;
        }

        .btn-reset {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-reset:hover { border-color: var(--danger); color: var(--danger); }

        /* ─── Main Layout ──────────────────────────── */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ─── Left Panel (Instructions) ────────────── */
        .panel-left {
            width: 480px;
            min-width: 350px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .panel-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border);
        }

        .panel-header .step-tag {
            display: inline-block;
            background: var(--accent);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .panel-header h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .panel-header p {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        /* ─── Tab Switcher ─────────────────────────── */
        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 0 12px;
            gap: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn:hover { color: var(--text); }
        .tab-btn.active {
            color: var(--accent-light);
            border-bottom-color: var(--accent-light);
        }

        /* ─── Lesson Content ──────────────────────── */
        .lesson-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: none;
        }

        .lesson-content.visible { display: block; }

        .lesson-content::-webkit-scrollbar { width: 6px; }
        .lesson-content::-webkit-scrollbar-track { background: transparent; }
        .lesson-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .lesson-content h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 18px 0 10px 0;
            color: var(--accent-light);
        }

        .lesson-content h3:first-child { margin-top: 0; }

        .lesson-content h4 {
            font-size: 14px;
            font-weight: 600;
            margin: 14px 0 8px 0;
            color: var(--text);
        }

        .lesson-content p {
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .lesson-content ul, .lesson-content ol {
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-dim);
            margin: 0 0 12px 20px;
        }

        .lesson-content li { margin-bottom: 4px; }

        .lesson-content code {
            background: var(--bg-primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: var(--cyan);
        }

        .lesson-content pre {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: var(--cyan);
            overflow-x: auto;
            margin: 8px 0 12px 0;
            line-height: 1.5;
        }

        .lesson-content .tip {
            background: rgba(108, 92, 231, 0.1);
            border-left: 3px solid var(--accent);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            margin: 12px 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-dim);
        }

        .lesson-content .lesson-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0 14px 0;
            font-size: 12px;
        }

        .lesson-content .lesson-table th {
            background: var(--bg-primary);
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .lesson-content .lesson-table td {
            padding: 6px 10px;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        .lesson-content strong { color: var(--text); }
        .lesson-content em { color: var(--text-dim); font-style: italic; }

        /* ─── Exercises List ──────────────────────── */
        .exercises-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: none;
        }

        .exercises-list.visible { display: block; }

        .exercises-list::-webkit-scrollbar { width: 6px; }
        .exercises-list::-webkit-scrollbar-track { background: transparent; }
        .exercises-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .exercise-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .exercise-card:hover { border-color: var(--accent); }
        .exercise-card.passed {
            border-color: var(--success);
            background: var(--success-bg);
        }
        .exercise-card.failed {
            border-color: var(--danger);
            background: var(--danger-bg);
        }

        .exercise-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .exercise-id {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-light);
        }

        .exercise-points {
            font-size: 11px;
            color: var(--text-dim);
            background: var(--bg-primary);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .exercise-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .exercise-desc {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.6;
        }

        .exercise-desc code {
            background: var(--bg-primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: var(--cyan);
        }

        .exercise-desc .hint {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-dim);
            opacity: 0.7;
            font-style: italic;
        }

        .exercise-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 12px;
            font-weight: 500;
        }

        .exercise-status.pass { color: var(--success); }
        .exercise-status.fail { color: var(--danger); }

        /* ─── Validate Button ──────────────────────── */
        .validate-bar {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
        }

        .btn-validate {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #845ec2);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-validate:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .btn-validate:active { transform: translateY(0); }

        .btn-validate.validating {
            background: var(--bg-card);
            pointer-events: none;
        }

        .btn-validate.success {
            background: linear-gradient(135deg, var(--success), #00a884);
        }

        /* ─── Right Panel (Terminal) ───────────────── */
        .panel-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .terminal-dots span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .terminal-dots span:nth-child(1) { background: #e17055; }
        .terminal-dots span:nth-child(2) { background: #fdcb6e; }
        .terminal-dots span:nth-child(3) { background: #00b894; }

        .terminal-title {
            font-size: 13px;
            color: var(--text-dim);
            font-family: monospace;
        }

        .terminal-status {
            margin-left: auto;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 600;
        }

        .terminal-status.connected { color: var(--success); background: var(--success-bg); }
        .terminal-status.disconnected { color: var(--danger); background: var(--danger-bg); }

        #terminal {
            flex: 1;
            padding: 4px;
        }

        /* ─── Resize Handle ────────────────────────── */
        .resize-handle {
            width: 4px;
            cursor: col-resize;
            background: var(--border);
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .resize-handle:hover { background: var(--accent); }

        /* ─── Animations ───────────────────────────── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .exercise-card { animation: fadeIn 0.3s ease both; }
        .exercise-card:nth-child(2) { animation-delay: 0.05s; }
        .exercise-card:nth-child(3) { animation-delay: 0.1s; }
        .exercise-card:nth-child(4) { animation-delay: 0.15s; }
        .exercise-card:nth-child(5) { animation-delay: 0.2s; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .validating-anim { animation: pulse 1s infinite; }

        /* ─── Toast Notification ───────────────────── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--accent); }

        /* ─── Responsive ───────────────────────────── */
        @media (max-width: 768px) {
            .main { flex-direction: column; }
            .panel-left { width: 100%; height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }
            .resize-handle { display: none; }
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="topbar">
        <div class="topbar-left">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="4 17 10 11 4 5"></polyline>
                    <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
                Linux CLI Lab
            </div>
        </div>
        <div class="topbar-center" id="step-dots"></div>
        <div class="topbar-right">
            <div class="score-display">
                <svg class="progress-ring" viewBox="0 0 40 40">
                    <circle class="bg" cx="20" cy="20" r="17"/>
                    <circle class="fg" id="progress-circle" cx="20" cy="20" r="17"
                        stroke-dasharray="106.8" stroke-dashoffset="106.8"/>
                </svg>
                <div>
                    <div class="score-num" id="score-num">0</div>
                    <div class="score-label">/ 100 pts</div>
                </div>
            </div>
            <button class="btn-reset" onclick="resetProgress()">Reset</button>
        </div>
    </div>

    <!-- Main -->
    <div class="main">
        <!-- Left Panel -->
        <div class="panel-left" id="panel-left">
            <div class="panel-header">
                <span class="step-tag" id="step-tag">Étape 1</span>
                <h2 id="step-title">Chargement...</h2>
                <p id="step-desc"></p>
            </div>
            <div class="tab-bar">
                <button class="tab-btn active" id="tab-lesson" onclick="switchTab('lesson')">Cours</button>
                <button class="tab-btn" id="tab-exercises" onclick="switchTab('exercises')">Exercices</button>
            </div>
            <div class="lesson-content visible" id="lesson-content"></div>
            <div class="exercises-list" id="exercises-list"></div>
            <div class="validate-bar">
                <button class="btn-validate" id="btn-validate" onclick="validateStep()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Vérifier maintenant
                </button>
                <div style="text-align:center;margin-top:6px;font-size:11px;color:var(--text-dim)">Vérification automatique toutes les 3s</div>
            </div>
        </div>

        <!-- Resize Handle -->
        <div class="resize-handle" id="resize-handle"></div>

        <!-- Right Panel -->
        <div class="panel-right">
            <div class="terminal-header">
                <div class="terminal-dots">
                    <span></span><span></span><span></span>
                </div>
                <span class="terminal-title">bash — linux-lab</span>
                <span class="terminal-status disconnected" id="ws-status">Connexion...</span>
            </div>
            <div id="terminal"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
    <script>
        // ─── State ─────────────────────────────────────
        let currentStep = 1;
        let stepsData = [];
        let ws = null;

        // ─── Terminal Setup ────────────────────────────
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace",
            theme: {
                background: '#0a0c10',
                foreground: '#e1e4ed',
                cursor: '#6c5ce7',
                selectionBackground: 'rgba(108, 92, 231, 0.3)',
                black: '#1a1d2e',
                red: '#e17055',
                green: '#00b894',
                yellow: '#fdcb6e',
                blue: '#6c5ce7',
                magenta: '#a29bfe',
                cyan: '#00cec9',
                white: '#e1e4ed',
            },
            allowProposedApi: true,
        });

        const fitAddon = new FitAddon.FitAddon();
        const webLinksAddon = new WebLinksAddon.WebLinksAddon();
        term.loadAddon(fitAddon);
        term.loadAddon(webLinksAddon);

        term.open(document.getElementById('terminal'));
        fitAddon.fit();

        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                document.getElementById('ws-status').textContent = 'Connecté';
                document.getElementById('ws-status').className = 'terminal-status connected';
                // Send initial size
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
            };

            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    term.write(new Uint8Array(event.data));
                } else {
                    term.write(event.data);
                }
            };

            ws.onclose = () => {
                document.getElementById('ws-status').textContent = 'Déconnecté';
                document.getElementById('ws-status').className = 'terminal-status disconnected';
                term.write('\r\n\x1b[31m[Session terminée. Rechargez la page.]\x1b[0m\r\n');
            };

            ws.onerror = () => {
                document.getElementById('ws-status').textContent = 'Erreur';
                document.getElementById('ws-status').className = 'terminal-status disconnected';
            };
        }

        term.onData((data) => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', data: data }));
            }
        });

        term.onResize(({ cols, rows }) => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'resize', cols, rows }));
            }
        });

        window.addEventListener('resize', () => fitAddon.fit());

        // ─── Panel Resize ──────────────────────────────
        const resizeHandle = document.getElementById('resize-handle');
        const panelLeft = document.getElementById('panel-left');
        let isResizing = false;

        resizeHandle.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const newWidth = Math.max(280, Math.min(700, e.clientX));
            panelLeft.style.width = newWidth + 'px';
            fitAddon.fit();
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                fitAddon.fit();
            }
        });

        // ─── API Calls ────────────────────────────────
        async function fetchSteps() {
            const res = await fetch('/api/steps');
            stepsData = await res.json();
            renderStepDots();
        }

        async function fetchStep(num) {
            const res = await fetch(`/api/step/${num}`);
            return res.json();
        }

        async function fetchProgress() {
            const res = await fetch('/api/progress');
            return res.json();
        }

        // ─── Render Functions ──────────────────────────
        function renderStepDots() {
            const container = document.getElementById('step-dots');
            container.innerHTML = stepsData.map(s => {
                let cls = '';
                if (s.num === currentStep) cls = 'active';
                else if (s.completed === s.total && s.total > 0) cls = 'done';
                else if (s.completed > 0) cls = 'partial';
                return `<div class="step-dot ${cls}" onclick="selectStep(${s.num})" title="Étape ${s.num}: ${s.title}">${s.num}</div>`;
            }).join('');
        }

        function switchTab(tab) {
            const lessonEl = document.getElementById('lesson-content');
            const exercisesEl = document.getElementById('exercises-list');
            const tabLesson = document.getElementById('tab-lesson');
            const tabExercises = document.getElementById('tab-exercises');

            if (tab === 'lesson') {
                lessonEl.classList.add('visible');
                exercisesEl.classList.remove('visible');
                tabLesson.classList.add('active');
                tabExercises.classList.remove('active');
            } else {
                lessonEl.classList.remove('visible');
                exercisesEl.classList.add('visible');
                tabLesson.classList.remove('active');
                tabExercises.classList.add('active');
            }
        }

        async function renderExercises(stepData) {
            document.getElementById('step-tag').textContent = `Étape ${stepData.num}`;
            document.getElementById('step-title').textContent = stepData.title;
            document.getElementById('step-desc').textContent = stepData.description;

            // Render lesson
            const lessonEl = document.getElementById('lesson-content');
            lessonEl.innerHTML = stepData.lesson || '<p>Pas de cours pour cette étape.</p>';

            // Render exercises
            const list = document.getElementById('exercises-list');
            list.innerHTML = stepData.exercises.map(ex => `
                <div class="exercise-card ${ex.completed ? 'passed' : ''}" id="card-${ex.id}">
                    <div class="exercise-top">
                        <span class="exercise-id">Exercice ${ex.id}</span>
                        <span class="exercise-points">${ex.points} pts</span>
                    </div>
                    <div class="exercise-title">${ex.title}</div>
                    <div class="exercise-desc">${ex.desc}</div>
                    ${ex.completed ? '<div class="exercise-status pass">&#10003; Validé</div>' : ''}
                </div>
            `).join('');

            // Show lesson tab by default when switching steps
            switchTab('lesson');
        }

        function updateScore(progress) {
            const score = progress.score || 0;
            document.getElementById('score-num').textContent = score;

            // Update ring
            const pct = score / 100;
            const circumference = 106.8;
            const offset = circumference * (1 - pct);
            document.getElementById('progress-circle').style.strokeDashoffset = offset;

            // Update color based on score
            const circle = document.getElementById('progress-circle');
            if (pct >= 0.9) circle.style.stroke = '#00b894';
            else if (pct >= 0.5) circle.style.stroke = '#a29bfe';
            else circle.style.stroke = '#6c5ce7';
        }

        // ─── Actions ──────────────────────────────────
        async function selectStep(num) {
            currentStep = num;
            const stepData = await fetchStep(num);
            renderExercises(stepData);
            await fetchSteps();

            // Reset validate button
            const btn = document.getElementById('btn-validate');
            btn.className = 'btn-validate';
            btn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Valider cette étape
            `;
        }

        async function validateStep() {
            // Switch to exercises tab to show results
            switchTab('exercises');

            const btn = document.getElementById('btn-validate');
            btn.className = 'btn-validate validating';
            btn.innerHTML = '<span class="validating-anim">Validation en cours...</span>';

            try {
                const res = await fetch(`/api/validate/${currentStep}`, { method: 'POST' });
                const data = await res.json();

                // Update exercise cards with results
                let allPassed = true;
                let newPoints = 0;

                for (const r of data.validation.results) {
                    const card = document.getElementById(`card-${r.id}`);
                    if (!card) continue;

                    // Remove old status
                    const oldStatus = card.querySelector('.exercise-status');
                    if (oldStatus) oldStatus.remove();

                    if (r.passed) {
                        card.className = 'exercise-card passed';
                        card.insertAdjacentHTML('beforeend',
                            `<div class="exercise-status pass">&#10003; ${r.message}${r.already ? ' (déjà validé)' : ''}</div>`);
                        if (!r.already) newPoints += r.points;
                    } else {
                        card.className = 'exercise-card failed';
                        card.insertAdjacentHTML('beforeend',
                            `<div class="exercise-status fail">&#10007; ${r.message}</div>`);
                        allPassed = false;
                    }
                }

                // Update score
                updateScore(data.progress);

                // Update step dots
                await fetchSteps();

                // Toast
                if (allPassed) {
                    showToast(`Étape ${currentStep} complète ! ${newPoints > 0 ? '+' + newPoints + ' pts' : ''}`, 'success');
                    btn.className = 'btn-validate success';
                    btn.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Étape validée !
                    `;

                    // Auto-advance after 2s if not last step
                    if (currentStep < stepsData.length) {
                        setTimeout(() => selectStep(currentStep + 1), 2000);
                    }
                } else {
                    if (newPoints > 0) {
                        showToast(`+${newPoints} pts — Continuez, il reste des exercices !`, 'info');
                    } else {
                        showToast('Certains exercices ne sont pas encore validés.', 'error');
                    }
                    btn.className = 'btn-validate';
                    btn.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Réessayer
                    `;
                }
            } catch (err) {
                showToast('Erreur de validation', 'error');
                btn.className = 'btn-validate';
                btn.innerHTML = 'Réessayer';
            }
        }

        async function resetProgress() {
            if (!confirm('Remettre votre score à zéro ?')) return;
            await fetch('/api/reset', { method: 'POST' });
            updateScore({ score: 0, completed: [] });
            await fetchSteps();
            selectStep(currentStep);
            showToast('Progression remise à zéro', 'info');
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.className = `toast ${type}`, 3000);
        }

        // ─── Init ─────────────────────────────────────
        // ─── Auto-validation ──────────────────────────
        let autoValidateTimer = null;

        async function autoValidate() {
            try {
                const res = await fetch(`/api/validate/${currentStep}`, { method: 'POST' });
                const data = await res.json();

                let newPoints = 0;
                let allPassed = true;

                for (const r of data.validation.results) {
                    const card = document.getElementById(`card-${r.id}`);
                    if (!card) continue;

                    if (r.passed) {
                        if (!card.classList.contains('passed')) {
                            // New completion!
                            card.className = 'exercise-card passed';
                            const oldStatus = card.querySelector('.exercise-status');
                            if (oldStatus) oldStatus.remove();
                            card.insertAdjacentHTML('beforeend',
                                `<div class="exercise-status pass">&#10003; ${r.message}</div>`);
                            if (!r.already) {
                                newPoints += r.points;
                            }
                        }
                    } else {
                        allPassed = false;
                    }
                }

                // Update score if changed
                if (newPoints > 0) {
                    updateScore(data.progress);
                    await fetchSteps();
                    showToast(`+${newPoints} pts !`, 'success');
                }

                // Auto-advance when step complete
                if (allPassed && currentStep < stepsData.length) {
                    showToast(`Étape ${currentStep} terminée !`, 'success');
                    setTimeout(() => selectStep(currentStep + 1), 2500);
                }
            } catch (e) {
                // Silently ignore polling errors
            }
        }

        function startAutoValidation() {
            if (autoValidateTimer) clearInterval(autoValidateTimer);
            autoValidateTimer = setInterval(autoValidate, 3000);
        }

        // ─── Init ─────────────────────────────────────
        async function init() {
            await fetchSteps();
            const progress = await fetchProgress();
            updateScore(progress);
            await selectStep(1);
            connectWS();
            startAutoValidation();
        }

        init();
    </script>
</body>
</html>
